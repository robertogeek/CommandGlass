# Construye el instalador de Windows de CommandGlass.
# - A mano: pestaña Actions → "Instalador de Windows" → Run workflow.
# - Automático: al subir una etiqueta de versión (git tag v0.1.0-beta && git push --tags).
# El .exe queda como artefacto de la ejecución (Summary → Artifacts, sin zip) y, con etiqueta, en su Release
# con las notas de CHANGELOG.md (escribe la sección de la versión antes de crear la etiqueta).
#
# Firma (opcional, se activa sola si existen los secretos del repositorio):
#   Certificado .pfx:        WIN_CSC_LINK (pfx en base64) + WIN_CSC_KEY_PASSWORD
#   Azure Artifact Signing:  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#                            AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Dependencias
        run: |
          npm ci
          npm ci --prefix client

      - name: Pruebas y tipos
        run: |
          npm test
          npm run typecheck

      # Etiqueta de pruebas: la versión de package.json más una coletilla (v0.1.5-beta-telemetry). El .exe lleva
      # la coletilla en el nombre y la release sale como versión de pruebas, sin quitarle a la estable el «Latest».
      - name: ¿Versión de pruebas?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -eq "v$version") { "Versión normal: $tag"; exit 0 }
          if (-not $tag.StartsWith("v$version-")) { throw "La etiqueta $tag no es de la versión de package.json ($version)" }
          $label = $tag.Substring("v$version-".Length)
          if ($label -notmatch '^[a-z0-9-]+$') { throw "Coletilla no válida: $label" }
          "CG_BUILD_SUFFIX=_$label" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CG_TEST_BUILD=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "Versión de pruebas: $label"

      - name: Construir instalador
        run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CG_AZURE_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          CG_AZURE_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          CG_AZURE_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          CG_AZURE_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
          # Sin secretos de firma, no intentar buscar certificados en el equipo.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: ¿Está firmado?
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} {2}" -f $_.Name, $s.Status, $s.SignerCertificate.Subject
          }

      # Sin zip: el artefacto es directamente el .exe que se reparte.
      - uses: actions/upload-artifact@v7
        with:
          path: release/commandglass_v*.exe
          archive: false
          if-no-files-found: error

      - name: Release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        # Notas desde CHANGELOG.md (la sección de esta versión). Si la release ya existe, solo se cambia el instalador.
        # En las versiones normales van también latest.yml y el .blockmap: es lo que lee la app para actualizarse sola
        # (desktop/updater.ts mira la release «Latest»). Las de pruebas solo llevan el .exe.
        run: |
          $tag = '${{ github.ref_name }}'
          $exe = Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          if (-not $exe) { throw 'No hay instalador en release/' }
          $files = @($exe.FullName)
          if (-not $env:CG_TEST_BUILD) {
            if (-not (Test-Path release/latest.yml)) { throw 'Falta release/latest.yml (configuración publish de electron-builder)' }
            $files += (Resolve-Path release/latest.yml).Path
            if (Test-Path "$($exe.FullName).blockmap") { $files += "$($exe.FullName).blockmap" }
          }
          node scripts/release-notes.mjs $tag | Out-File notes.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Falta la sección de $tag en CHANGELOG.md" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } elseif ($env:CG_TEST_BUILD) {
            gh release create $tag @files --title "CommandGlass $tag (pruebas)" --notes-file notes.md --prerelease --latest=false
          } else {
            gh release create $tag @files --title "CommandGlass $tag" --notes-file notes.md --latest
          }
