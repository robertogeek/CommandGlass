# Construye el paquete de CommandGlass para la Microsoft Store (.appx sin firmar: la Store lo firma al publicarlo).
# - A mano: pestaña Actions → "Microsoft Store" → Run workflow.
# - Automático: al subir una etiqueta de versión (v*), igual que el instalador.
# El .appx queda como artefacto de la ejecución; se sube a mano en Partner Center (ver docs/microsoft-store.md).
#
# Identidad del producto (Partner Center → tu app → Administración de productos → Identidad del producto).
# No son secretas: van en Settings → Secrets and variables → Actions → pestaña Variables.
#   APPX_IDENTITY        Package/Identity/Name        (por ejemplo 12345SpaceCowboys.CommandGlass)
#   APPX_PUBLISHER       Package/Identity/Publisher   (CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)
#   APPX_PUBLISHER_NAME  Package/Properties/PublisherDisplayName
name: Microsoft Store

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  appx:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Dependencias
        run: |
          npm ci
          npm ci --prefix client

      - name: Pruebas y tipos
        run: |
          npm test
          npm run typecheck

      - name: Comprobar la identidad
        shell: pwsh
        run: |
          if (-not '${{ vars.APPX_IDENTITY }}' -or -not '${{ vars.APPX_PUBLISHER }}') {
            Write-Output '::warning::Faltan las variables APPX_IDENTITY y APPX_PUBLISHER: el paquete sale con una identidad de prueba y Partner Center lo rechazará.'
          }

      # makeappx y makepri del SDK de Windows que trae el runner (el paquete de herramientas antiguo de electron-builder falla en algunos equipos).
      - name: SDK de Windows
        shell: pwsh
        run: |
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $kit) { throw 'No encuentro makeappx.exe en el SDK de Windows' }
          "ELECTRON_BUILDER_WINDOWS_KITS_PATH=$(Join-Path $kit.FullName 'x64')" >> $env:GITHUB_ENV

      - name: Construir paquete
        run: npm run dist:store
        env:
          CG_APPX_IDENTITY: ${{ vars.APPX_IDENTITY }}
          CG_APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
          CG_APPX_PUBLISHER_NAME: ${{ vars.APPX_PUBLISHER_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          path: release/commandglass_v*.appx
          archive: false
          if-no-files-found: error
