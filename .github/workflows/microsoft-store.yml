# Construye el paquete de CommandGlass para la Microsoft Store (.appx sin firmar: la Store lo firma al publicarlo).
# - A mano: pestaña Actions → "Microsoft Store" → Run workflow.
# - Automático: al subir una etiqueta de versión (v*), igual que el instalador.
# El .appx queda como artefacto de la ejecución; se sube a mano en Partner Center (ver docs/microsoft-store.md).
#
# La identidad del producto de Partner Center ya está en electron-builder.config.cjs.
name: Microsoft Store

on:
  workflow_dispatch:
  push:
    # Las versiones de pruebas (v0.1.5-beta-telemetry) no van a la Store.
    tags: ['v*', '!v*-*-*']

permissions:
  contents: read

jobs:
  appx:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Dependencias
        run: |
          npm ci
          npm ci --prefix client

      - name: Pruebas y tipos
        run: |
          npm test
          npm run typecheck

      # makeappx y makepri del SDK de Windows que trae el runner (el paquete de herramientas antiguo de electron-builder falla en algunos equipos).
      - name: SDK de Windows
        shell: pwsh
        run: |
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $kit) { throw 'No encuentro makeappx.exe en el SDK de Windows' }
          "ELECTRON_BUILDER_WINDOWS_KITS_PATH=$(Join-Path $kit.FullName 'x64')" >> $env:GITHUB_ENV

      - name: Construir paquete
        run: npm run dist:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          path: release/commandglass_v*.appx
          archive: false
          if-no-files-found: error
